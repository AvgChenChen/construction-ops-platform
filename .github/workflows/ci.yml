name: Mills checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mills
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mills_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mills"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mills:ci-only-password@127.0.0.1:5432/mills_test
      TEST_DATABASE_URL: postgresql://mills:ci-only-password@127.0.0.1:5432/mills_test
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_MODE: local
      DEPLOYMENT_ENV: local
      DASHBOARD_PASSWORD: isolated-ci-password
      BROWSER_CHANNEL: chromium
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate configuration
        run: npm run ops:preflight
      - name: Migrate and test
        run: npm run db:migrate && npm run typecheck && npm test
      - name: Build application
        run: npm run build
      - name: Browser acceptance tests
        run: |
          npm run start > /tmp/mills-web.log 2>&1 &
          npm run worker > /tmp/mills-worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health/ready && break || sleep 2; done
          npm run test:e2e
      - name: Build deployment image
        run: docker build -t mills:ci .
