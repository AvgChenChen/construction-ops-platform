name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: Playwright doesn't support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ops_app
          POSTGRES_PASSWORD: ops_ci
          POSTGRES_DB: construction_ops_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops_app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ops_app:ops_ci@localhost:5432/construction_ops_dev?schema=public
      TEST_DATABASE_URL: postgresql://ops_app:ops_ci@localhost:5432/construction_ops_test?schema=public
      SEED_DEMO_PASSWORD: ci-only-demo-password
      APP_TIMEZONE: America/Toronto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (runtime dependencies, fail on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - name: Create test database
        run: PGPASSWORD=ops_ci psql -h localhost -U ops_app -d construction_ops_dev -c "CREATE DATABASE construction_ops_test"
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - run: npm run build
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t construction-ops-platform:ci .
