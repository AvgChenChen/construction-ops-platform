# Use an external managed PostgreSQL database with verified TLS.
x-runtime: &runtime
    image: mills:${RELEASE_TAG:-local}
  build:
    context: ..
  env_file: ${PRODUCTION_ENV_FILE:-./production.env}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
    - /app/.next/cache:rw,uid=1000,gid=1000,size=128m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 150s
services:
  web:
    <<: *runtime
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  worker:
    <<: *runtime
    command: [npm, run, worker]
    shm_size: 1gb
  backup:
    <<: *runtime
    command: ["npm", "run", "backup:loop"]
    environment:
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
  migrate:
    <<: *runtime
    restart: "no"
    profiles: [tools]
    command: ["npm", "run", "db:migrate"]
volumes:
  backups:
