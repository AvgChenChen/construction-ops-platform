# Local demo stack: Postgres, a one-off migrate+seed job, and the app.
# Credentials here are for local development only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ops_app
      POSTGRES_PASSWORD: ops_local_dev
      POSTGRES_DB: construction_ops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_app -d construction_ops"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: build }
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://ops_app:ops_local_dev@db:5432/construction_ops?schema=public
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-password-2026}
      APP_TIMEZONE: America/Toronto
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://ops_app:ops_local_dev@db:5432/construction_ops?schema=public
      APP_TIMEZONE: America/Toronto
      # Plain HTTP on localhost. Set to true (or remove) behind HTTPS.
      COOKIE_SECURE: "false"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
